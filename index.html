<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,
 initial-scale=1.0, maximum-scale=1.0, user-scalable = no">
 <link rel="manifest" href="manifest.json">
 <meta name="theme-color" content="#000000">
 <title>공</title>
 <style>
  #player{
    width: 50px;
    height: 50px;
    background: yellow;
    border-radius: 50%;

    position: absolute;
    top: 100px;
    left: 100px;
  }
  button{
   width: 80px;
   height: 80px;
   background: gray;
   opacity: 0.5;
  }
  #leftButton,
  #rightButton {

   width: 70px;
   height: 70px;
   background: gray;
   opacity: 0.5;

   font-size: 40px;
   text-align: center;
   line-height: 70px;

   display: inline-block;

   user-select: none;
   touch-action: none;
   position: fixed;
   bottom: 10px;
}
  #leftButton {
     left: 20px;
  }
  #rightButton {
     left: 95px;
  }
  #well {
      background: black;
      width: 200px;
      height: 300px;
      position: fixed;
      bottom: 0px;
      left: 200px;
      z-index: 1;
  }
 </style>
</head>
<body>
 <div id="player"></div>
 <div id="leftButton">《</div>
 <div id="rightButton">》</div>

 <div id="well"></div>
 
 <script>
  if ("serviceWorker" in navigator) {
   navigator.serviceWorker.register("sw.js");
  }
  let moveX = 0;
  let moveY = 0;
  let playerX = 100;
  let playerY = 100;
  let fakep = 100;
  let fakey = 100;
  let gra = 0.1;
  
const leftButton = document.getElementById("leftButton");
const rightButton = document.getElementById("rightButton");
  
  leftButton.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveX = -3;
});

leftButton.addEventListener("touchend", () => {
  moveX = 0;
});

rightButton.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveX = 3;
});

rightButton.addEventListener("touchend", () => {
  moveX = 0;
});
  function collision() {
    let player = document.getElementById("player");
    let well = document.getElementById("well");
   
    let p = player.getBoundingClientRect();
    let w = well.getBoundingClientRect();
    return (
    p.left < w.right &&
    p.right > w.left &&
    p.top < w.bottom &&
    p.bottom > w.top
  );
  }
  function move() {
   document.getElementById("player").style.left =
      playerX + "px";
   document.getElementById("player").style.up =
      playerY + "px";
  }
  function gameLoop() {
  moveY += gra;

  fakey = playerY;
  fakep = playerX;
  playerX += moveX;
  playerY += moveY
  move();

  if (collision()) {
    playerX = fakep;
    move();
  }

  requestAnimationFrame(gameLoop);
  }

  gameLoop();
 </script>
</body>
</html>
